- paper: khandagale-et-al-2022-polysynthetic
  languages: [inuktitut]
  source:
    kind: paper
    ref: /summaries/khandagale-et-al-2022-polysynthetic/
    quote: >-
      Testing on two typologically distinct polysynthetic languages — Adyghe (Northwest
      Caucasian) and Eastern Canadian Inuktitut — the authors show that incorporating
      linguist-provided morphological knowledge into the MorphAGram framework improves
      segmentation quality, and that using stems (rather than words) as the unit of
      abstraction improves POS tagging through cross-lingual projection.
  note: >-
    Inuktitut is one of exactly two test languages (with Adyghe), but each gets its own
    contributed gold-standard dataset and its own reported results in this paper — full
    experimental subject matter, not a passing mention, even though Inuktitut is not the
    paper's sole focus.
