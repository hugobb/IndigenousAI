caveat: >-
  Glottolog has no family node named plainly "Guarani" — only the much
  broader "Tupi-Guarani". The unqualified name is recorded here as
  Paraguayan Guaraní (para1311): the variety many NLP resources catalogue
  simply as "Guarani" (ISO gug) and the official language of Paraguay.
  Eastern Bolivian Guaraní (east2555), Western Bolivian Guaraní (west2640)
  and Mbyá Guaraní (mbya1239) are separate Glottolog languages this record
  does not cover; a curator should confirm which variety each candidate
  paper actually means before promoting this record.
