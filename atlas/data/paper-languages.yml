# Which language each paper STUDIES. Hand-curated; the one place this link can
# live, since data/derived/papers.json is generator output and
# litterature_review/OVERVIEW.md is never edited.
#
# THE LOCATION RULE (spec D2): the quote must come from the paper's own
# subject matter — its title, header block, or a section BEFORE
# `## Relevance to Indigenous AI`. That section is the REVIEWER writing about
# applicability to this project: 86 of 92 summaries name Mohawk there and only
# 6 in their own subject matter. A quote taken from it is refused by
# validate.ts and by tests/paper-mappings.test.ts — except for a
# `status: rejected` entry, which both exclude from this check entirely: a
# mapping withdrawn from the shipped set is withdrawn from every gate that
# would otherwise apply to its quote.
#
# THE STUDIES RULE (not mechanically enforced — curator judgment): passing a
# quote's LOCATION does not mean it is evidence the paper STUDIES the
# language. A mapping asserts the paper builds for the language, runs
# experiments on it, or takes it as its subject. Naming the language as a
# typological example (one of several languages listed to illustrate a
# category), a comparison to another language the paper actually studies, a
# speaker-count-bracket illustration, or a community artifact mentioned in
# passing (a license, a project name) is NOT enough, even when the sentence
# sits safely before the Relevance heading — reviewer-shaped reasoning can
# leak into a Key Concepts or Main Findings bullet just as easily as into the
# Relevance section itself; the heading is not a reliable fence for that.
# When the evidence for a mapping is real but weaker than title-level (e.g.
# the language is one of many the paper empirically evaluates, without being
# its subject), the `note` field must say so plainly — it is the curator's
# hedge and it travels into the bundle.
#
# Ambiguity means OMIT the paper, never guess.
#
# Candidates were found with the shell command in the task brief (11 papers
# naming Mohawk/Kanien'kéha, Māori, or Amharic anywhere before the Relevance
# heading). Of those 11, only 3 survive both rules; the other 8 are recorded
# below at `status: rejected`, each with its own verbatim quote and the reason
# it was refused. This file is now the only record of that reasoning — the
# task report it used to live in is gitignored and will not ship with the
# repository.
#
# Every entry below is `status: draft` until the maintainer reviews it, except
# the 8 already reviewed to `status: rejected`.

- paper: kuhn-et-al-2020-nrc-canada
  languages: [kanienkeha]
  source:
    kind: paper
    ref: /summaries/kuhn-et-al-2020-nrc-canada/
    quote: >-
      A software framework for building verb conjugators for polysynthetic languages,
      instantiated for Kanyen'kéha (Mohawk).
  note: >-
    The NRC project this paper describes also built for Inuktut (the Nunavut Hansard
    corpus) and SENĆOŦEN (decentralized predictive text) — this mapping names only
    kanienkeha because the atlas has no language record for either of those two yet,
    not because the paper's own work is limited to Mohawk.
  status: draft

- paper: rai-and-pal-2025-amharic
  languages: [amharic]
  source:
    kind: paper
    ref: /summaries/rai-and-pal-2025-amharic/
    quote: >-
      A Transformer-Based Framework for Domain-Sensitive Amharic to English Machine
      Translation with Character-Aware Subword Encoding
  status: draft

- paper: feng-et-al-2025-culfit
  languages: [amharic]
  source:
    kind: paper
    ref: /summaries/feng-et-al-2025-culfit/
    quote: >-
      Low-resource language regions (Sundanese in West Java, Amharic in Ethiopia) show
      the largest gains, validating the approach for truly under-represented cultures.
  note: >-
    Weaker than title-level evidence: Amharic is one of 23 evaluation languages in the
    paper's GlobalCultureQA benchmark, not the paper's subject. Kept because the paper
    reports a specific measured result for it (largest gains among low-resource
    regions), which is more than a passing mention — but a reader should not read this
    as an Amharic-focused paper.
  status: draft

# The 8 candidates below were considered and refused. Kept at
# `status: rejected` (not deleted) so re-sourcing never re-proposes them
# without a curator seeing why they were turned down the first time.

- paper: arnett-and-bergen-2025-morphologically-complex
  languages: [kanienkeha]
  source:
    kind: paper
    ref: /summaries/arnett-and-bergen-2025-morphologically-complex/
    quote: >-
      Agglutinative languages (Turkish, Finnish, Mohawk) stack distinct morphemes,
      producing many unique word forms.
  note: >-
    Mohawk is named only as one of three typological examples in a morphology
    glossary. The paper's own Limitations section confirms it: no genuinely
    polysynthetic language (like Mohawk) is included in its 22-language MorphScore
    evaluation. The paper does not study Kanien'kéha. Rejected.
  status: rejected

- paper: haddow-et-al-2022-survey-low-ressource
  languages: [kanienkeha]
  source:
    kind: paper
    ref: /summaries/haddow-et-al-2022-survey-low-ressource/
    quote: >-
      Transfer from related languages is most effective when source and target
      languages are typologically similar; this limits transfer to Mohawk, which has
      few close linguistic relatives with NLP resources.
  note: >-
    This is the survey's general typological-transfer finding applied to Mohawk in
    the summary's own words, not something the survey (a broad literature review of
    low-resource MT methods) specifically investigates about Kanien'kéha. Too close to
    relevance-shaped commentary to trust as evidence the paper studies Mohawk.
    Rejected.
  status: rejected

- paper: le-and-sadat-2021-canada
  languages: [kanienkeha]
  source:
    kind: paper
    ref: /summaries/le-and-sadat-2021-canada/
    quote: >-
      The study confirms that Inuktitut, while still polysynthetic, has reached a
      "medium-resource" level thanks to the Nunavut Hansard — a level Mohawk has not
      reached.
  note: >-
    The paper's subject is Inuktitut/Inuinnaqtun machine translation; Mohawk appears
    only once, as a comparative aside benchmarking Inuktitut's resource level against
    it. Not a language the paper studies. Rejected.
  status: rejected

- paper: liu-et-al-2021-morphological-segmentation
  languages: [kanienkeha]
