# Curator judgment, not a Glottolog fact: Yupik languages are spoken by
# circumpolar peoples on both sides of the Bering Strait — Central Alaskan
# and Pacific Gulf Yupik in Alaska (US), Central Siberian and Naukan Yupik
# in Chukotka (Russia). No single continent-based REGIONS member covers
# both without asserting a location for half the family that is wrong for
# the other half; `arctic` is the one member that already exists in this
# atlas (aleut.yml) to name a circumpolar Indigenous identity rather than a
# continent.
region: arctic
countries: []
centre: null
caveat: >-
  A cover term, not a single language: Glottolog places 4 languages under
  Yupik (yupi1267) — child_language_count fetched 2026-09-06 from
  https://glottolog.org/resource/languoid/id/yupi1267.json — spanning
  Central Alaskan, Central Siberian, Naukan and Pacific Gulf Yupik. Every
  summary in this corpus that mentions Yupik names it at that level, never a
  specific variety. Glottolog publishes no coordinates for a family, so this
  record carries no centre and does not draw.
