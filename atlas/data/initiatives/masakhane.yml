transferability:
  transfers:
    - "Participatory, distributed research practice: weekly open meetings, a public Slack and a public GitHub, with no prerequisite for joining beyond a code of conduct."
    - "Building benchmarks across many languages at once (MasakhaNER, LAFAND-MT) rather than one language in isolation."
    - "Publishing code and data openly, and refusing to put community contributions behind a paywall."
  does_not_transfer:
    - "The open/MIT+CC-BY posture. It is the opposite of the sovereignty posture several Indigenous initiatives in this atlas take — compare Te Hiku Media's Kaitiakitanga License, under which data is never released for unrestricted or commercial reuse."
    - "Data-scale assumptions. Amharic has orders of magnitude more digital text, speakers and institutional support than the Indigenous languages here; methods tuned to Amharic's regime may assume corpora that do not exist."
    - "'For Africans, by Africans' names a continental research community. It is not a substitute for consent from, and control by, a specific language community, which is what the Indigenous tier turns on."
  note: >-
    Masakhane is in the adjacent tier because it is grassroots and community-organised but
    not Indigenous-governed in the sense this atlas uses. What transfers is the organising
    model — distributed, participatory, open-by-default, benchmark-first. What does not
    transfer is the licensing posture: open release is a reasonable default for a
    widely-spoken national language and an unreasonable one where a community asserts
    kaitiakitanga over recordings of its last first-language speakers. Read Masakhane for
    how to build a community, not for how to license its outputs.
