caveat: >-
  Glottolog has no single node named plainly "Inuktitut": it splits into two
  sibling languages, Eastern Canadian Inuktitut (this record, iso ike) and
  Western Canadian Inuktitut (west2618, iso ikt). Eastern is recorded here
  because it is the written standard used in Nunavut government publishing
  and in NLP corpora (e.g. the Nunavut Hansard) that use the unqualified name
  "Inuktitut". A curator who can check a specific paper's actual dialect
  should confirm or override this before promoting the record.
