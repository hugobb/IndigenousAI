# What Glottolog returned for every glottocode used ANYWHERE in the atlas —
# not only the 31 candidate names surveyed for this sub-project (SP3b), but
# also the glottocodes carried by language records sourced before it (Amharic,
# Choctaw, Myaamia, Te Reo Māori). This is the audit trail for spec D9's
# resolution step, which D9 itself calls "the one step in this whole
# sub-project that can fail silently": "Maya" matches ~86 languoids on
# Glottolog's search, "Nahuatl" ~144, "Quechua" ~185, and picking the wrong
# one produces a record that looks entirely correct to every automated check
# and to a casual reader. Task 3 turns this file into a guard that refuses any
# language record whose `glottocode` appears in no row here — a file scoped
# only to SP3b's candidates would force that guard to skip codes it cannot
# find, which is exactly the silent hole this file exists to close. Tasks 4-6
# write SP3b's own new records from these rows.
#
# `latitude`/`longitude` are Glottolog's own published values, fetched from
# `https://glottolog.org/resource/languoid/id/<glottocode>.json` and quoted
# VERBATIM — never computed, never approximated, never filled from memory.
# `classification` is that same response's `classification` array, `name`
# values only, outermost family first.
#
# `level: family` means the searched name is a COVER TERM, not a single
# language (spec D8 applies downstream): Glottolog's family-level entries
# carry no coordinates and no ISO 639-3 code, confirmed here and in D8/D9's
# own pre-verification against quec1387, azte1234, maya1287, chat1268,
# otom1300 and tupi1275. `level: dialect` covers two names (SENĆOŦEN,
# Inuinnaqtun) that Glottolog files one step below `language`; Glottolog
# publishes NO coordinate and no ISO code for any dialect-level languoid,
# confirmed for both codes here — it is what Glottolog's own data says, not a
# fetch failure.
#
# `searched` is the name as the CORPUS (or, for the four pre-existing records,
# the record itself) writes it, never Glottolog's own name. The two differing
# is expected and is the entire point of the row (SENĆOŦEN -> Saanich,
# Rarámuri -> Tarahumaran) — `note` explains it whenever the reasoning is not
# obvious from the two names alone. The four rows for records sourced before
# this sub-project say so explicitly in their own note, since there was no
# resolution judgment call to make for them — they exist only so Task 3's
# guard has a row to find.

