caveat: >-
  A cover term, not a single language: Glottolog's search for the accented
  corpus spelling "Rarámuri" returns zero results; "Tarahumara" (the Spanish
  exonym for the same people and language) surfaces the family, named
  Tarahumaran (tara1321) in Glottolog's own data. Glottolog places 5
  languages under it — child_language_count fetched 2026-09-06 from
  https://glottolog.org/resource/languoid/id/tara1321.json — Central,
  Northern, Southeastern, Southwestern and Western Tarahumara. Every summary
  in this corpus found to mention Rarámuri/Raramuri names it at that level;
  no summary was found narrowing it to a specific variety, but that search
  was not exhaustive (grep-derived counts of this corpus have run low before
  — spec D8), so this does not claim no such summary exists. Glottolog
  publishes no coordinates for a family, so this record carries no centre and
  does not draw.
