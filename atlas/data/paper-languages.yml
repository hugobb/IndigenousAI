      propose auditing practices grounded in Hawaiian values
  note: >-
    Unlike the rejected godwin-jones/meighan entries (a one-sentence paired example),
    this paper's fieldwork and community are genuinely and sustainedly Hawaiian — but its
    own stated subject is "cultural misrepresentation" in AI outputs generally (five
    dimensions: hallucinated content, stereotypical depictions, Western narrative
    dominance, missing ethnic diversity, and historicizing framing), not the Hawaiian
    language specifically. The one clearly language-specific finding (missing 'okina
    punctuation in 'Olelo Hawai'i) appears as a single item inside a list of narrative and
    historical harms, not as its own investigated topic. This is HCI/co-design research
    about auditing practice grounded in a Hawaiian community's values and knowledge
    system, not NLP work that builds for, or runs experiments on, the Hawaiian language.
    Rejected.
  status: rejected

