caveat: >-
  A cover term, not a single language: Glottolog places 43 languages under
  Quechuan (quec1387) — child_language_count fetched 2026-09-06 from
  https://glottolog.org/resource/languoid/id/quec1387.json. Most summaries
  in this corpus name Quechua at that level, but one (a Southern
  Quechua-to-Spanish translation study) names a specific variety, Southern
  Quechua. This record does not follow it down to that variety: Glottolog
  publishes no coordinates for a family, and narrowing only this record to
  one variety while the other 42 languages remain unmapped would overstate
  what is actually sourced. The record carries no centre and does not draw.
