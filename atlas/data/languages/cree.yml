# A COVER TERM, not a language. See data/glottolog-resolution.yml for the
# fetched response this record was written from.
id: cree
name: Cree
also_known_as: []
glottocode: null
iso639_3: cre
tier: indigenous
family: Algic
subfamily: Algonquian-Blackfoot
typology: []
endangerment: null
