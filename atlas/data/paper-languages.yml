# Which language each paper STUDIES. Hand-curated; the one place this link can
# live, since data/derived/papers.json is generator output and
# litterature_review/OVERVIEW.md is never edited.
#
# THE LOCATION RULE (spec D2): the quote must come from the paper's own
# subject matter — its title, header block, or a section BEFORE
# `## Relevance to Indigenous AI`. That section is the REVIEWER writing about
# applicability to this project: 86 of 92 summaries name Mohawk there and only
# 6 in their own subject matter. A quote taken from it is refused by
# validate.ts and by tests/paper-mappings.test.ts.
#
# THE STUDIES RULE (not mechanically enforced — curator judgment): passing a
# quote's LOCATION does not mean it is evidence the paper STUDIES the
# language. A mapping asserts the paper builds for the language, runs
# experiments on it, or takes it as its subject. Naming the language as a
# typological example (one of several languages listed to illustrate a
# category), a comparison to another language the paper actually studies, a
# speaker-count-bracket illustration, or a community artifact mentioned in
# passing (a license, a project name) is NOT enough, even when the sentence
# sits safely before the Relevance heading — reviewer-shaped reasoning can
# leak into a Key Concepts or Main Findings bullet just as easily as into the
# Relevance section itself; the heading is not a reliable fence for that.
# When the evidence for a mapping is real but weaker than title-level (e.g.
# the language is one of many the paper empirically evaluates, without being
# its subject), the `note` field must say so plainly — it is the curator's
# hedge and it travels into the bundle.
#
# Ambiguity means OMIT the paper, never guess.
#
# Candidates were found with the shell command in the task brief (11 papers
# naming Mohawk/Kanien'kéha, Māori, or Amharic anywhere before the Relevance
# heading). Of those 11, only 3 survive both rules. See task-3-report.md for
# the full accept/reject table and reasoning, including a fix round that
# caught two accepts held to a looser standard than the rejects.
#
# Every entry is `status: draft` until the maintainer reviews it.

- paper: kuhn-et-al-2020-nrc-canada
  languages: [kanienkeha]
  source:
    kind: paper
    ref: /summaries/kuhn-et-al-2020-nrc-canada/
    quote: >-
      A software framework for building verb conjugators for polysynthetic languages,
      instantiated for Kanyen'kéha (Mohawk).
  status: draft

- paper: rai-and-pal-2025-amharic
  languages: [amharic]
  source:
    kind: paper
    ref: /summaries/rai-and-pal-2025-amharic/
    quote: >-
      A Transformer-Based Framework for Domain-Sensitive Amharic to English Machine
      Translation with Character-Aware Subword Encoding
  status: draft

- paper: feng-et-al-2025-culfit
  languages: [amharic]
  source:
    kind: paper
    ref: /summaries/feng-et-al-2025-culfit/
    quote: >-
      Low-resource language regions (Sundanese in West Java, Amharic in Ethiopia) show
      the largest gains, validating the approach for truly under-represented cultures.
  note: >-
    Weaker than title-level evidence: Amharic is one of 23 evaluation languages in the
    paper's GlobalCultureQA benchmark, not the paper's subject. Kept because the paper
    reports a specific measured result for it (largest gains among low-resource
    regions), which is more than a passing mention — but a reader should not read this
    as an Amharic-focused paper.
  status: draft
